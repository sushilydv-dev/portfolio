<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Availability Icons</title>
<style>
  @font-face { font-family: 'Chillax'; src: url('../../src/assets/fonts/chillax-variable.woff2') format('woff2'); font-weight: 200 700; font-display: swap; }

  :root { --bg: #f6f6f3; --ink: #1a1a1a; --muted: #5c5c5a; --line: #e0e0dc; --accent: #2747e6; --card: #fff; }
  .dark { --bg: #121212; --ink: #ececea; --muted: #a1a19e; --line: #2c2c2c; --accent: #7b93ff; --card: #1b1b1b; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #f6f6f3; color: #1a1a1a; font-family: 'Chillax', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 40px 16px 64px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; }
  .intro { margin-top: 8px; color: #5c5c5a; font-size: 16px; max-width: 60ch; line-height: 1.5; }
  .grid { margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; border: 1px solid #e0e0dc; border-radius: 18px; overflow: hidden; background: #fff; }
  .card p.why { flex: 1; }
  .card header { display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 0; }
  .card header b { font-size: 22px; }
  .card header span { font-weight: 600; }
  .card p.why { padding: 4px 18px 12px; color: #5c5c5a; font-size: 13px; line-height: 1.45; }
  .demo { display: flex; align-items: center; justify-content: center; padding: 26px 14px; background: var(--bg); color: var(--ink); font-size: 18px; font-weight: 500; white-space: nowrap; }
  .demo + .demo { border-top: 1px solid var(--line); }
  .line { display: inline-flex; align-items: center; gap: 10px; }
  .line > :first-child { font-size: 1.25em; }
  .icon { width: 1em; height: 1em; flex-shrink: 0; color: var(--accent); overflow: visible; }
  .glow { filter: drop-shadow(0 0 3px var(--accent)); animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { filter: drop-shadow(0 0 7px var(--accent)) drop-shadow(0 0 2px var(--accent)); } }
  .fb { transform-box: fill-box; transform-origin: center; }

  /* 1 Lightning bolt: flickers like it is charged */
  .bolt { animation: flicker 3.5s infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 8% { opacity: .35; } 10% { opacity: 1; } 13% { opacity: .5; } 15% { opacity: 1; } }

  /* 2 AI orb: glowing sphere with a moving highlight */
  .orb { width: .9em; height: .9em; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 30% 28%, #fff 0, color-mix(in srgb, var(--accent) 35%, #fff) 18%, var(--accent) 55%, color-mix(in srgb, var(--accent) 55%, #000) 100%);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 2px var(--accent);
    animation: orb 5s linear infinite, orbglow 3s ease-in-out infinite; }
  @keyframes orb { to { transform: rotate(360deg); } }
  @keyframes orbglow { 50% { box-shadow: 0 0 14px var(--accent), 0 0 3px var(--accent); } }

  /* 3 Live bars: little equaliser */
  .bars rect { animation: bar 1.1s ease-in-out infinite; }
  .bars rect:nth-child(2) { animation-delay: -.35s; } .bars rect:nth-child(3) { animation-delay: -.7s; }
  .bars rect { transform-box: fill-box; transform-origin: bottom; }
  @keyframes bar { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  /* 4 Signal: broadcasting waves */
  .signal .w1 { animation: wave 2s ease-in-out infinite; }
  .signal .w2 { animation: wave 2s ease-in-out infinite .3s; }
  @keyframes wave { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }

  /* 5 Check badge: tick draws itself in */
  .check .tick { stroke-dasharray: 14; stroke-dashoffset: 14; animation: draw 3.5s ease-in-out infinite; }
  @keyframes draw { 15%, 80% { stroke-dashoffset: 0; } 95%, 100% { stroke-dashoffset: -14; } }

  /* 6 Heartbeat: a pulse line travelling */
  .beat path { stroke-dasharray: 40 60; stroke-dashoffset: 100; animation: beat 2.2s linear infinite; }
  @keyframes beat { to { stroke-dashoffset: 0; } }

  /* 7 Asterisk: six arms slowly spinning */
  .ast { animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 8 Code prompt (current): blinking cursor */
  .prompt .cur { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pick the availability icon</h1>
  <p class="intro">Each option is shown next to the real text, in the light theme and dark theme. All use your cobalt blue with a glow. Tell me the number you like.</p>
  <div class="grid" id="grid"></div>
</div>

<template id="icons">
  <svg data-n="1" data-name="Lightning bolt" data-why="Fast, energetic: ready to start now." class="icon glow" viewBox="0 0 24 24"><path class="bolt" d="M13.5 2 4.5 13.5h6.5L9.5 22l9-11.5H12L13.5 2Z" fill="currentColor" /></svg>
  <span data-n="2" data-name="AI orb" data-why="A glowing sphere with a moving highlight, like an AI assistant. Ties in with your local-LLM work." class="orb"></span>
  <svg data-n="3" data-name="Live bars" data-why="A tiny equaliser: something is live and active right now." class="icon glow bars" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="4" height="15" rx="2" /><rect x="10" y="5" width="4" height="15" rx="2" /><rect x="16" y="5" width="4" height="15" rx="2" /></svg>
  <svg data-n="4" data-name="Signal" data-why="Broadcasting waves: open and reachable." class="icon glow signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none" /><path class="w1" d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6" /><path class="w2" d="M5.2 5.2a9.6 9.6 0 0 0 0 13.6M18.8 5.2a9.6 9.6 0 0 1 0 13.6" /></svg>
  <svg data-n="5" data-name="Check badge" data-why="Like a verified badge: confirmed available. The tick draws itself in." class="icon glow check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.4 1.8 3 .1.9 2.9 2.4 1.8-.9 2.9.9 2.9-2.4 1.8-.9 2.9-3 .1L12 21.5l-2.4-1.8-3-.1-.9-2.9-2.4-1.8.9-2.9-.9-2.9 2.4-1.8.9-2.9 3-.1L12 2.5Z" /><path class="tick" d="M8.5 12.2l2.4 2.4 4.6-4.8" /></svg>
  <svg data-n="6" data-name="Heartbeat" data-why="A pulse travelling along a line: alive and active." class="icon glow beat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12h5l2-5 3.5 11 3-14 2 8h5.5" pathLength="100" /></svg>
  <svg data-n="7" data-name="Asterisk" data-why="A simple six-armed mark that slowly spins. Graphic, quiet and stylish." class="icon glow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><g class="ast fb"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9" /></g></svg>
  <svg data-n="8" data-name="Code prompt (current)" data-why="What is on the site now: a terminal prompt with a blinking cursor." class="icon glow prompt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5l5.5 5.5L5 17.5" /><path class="cur" d="M13.5 17.5h6" /></svg>
</template>

<script>
  const grid = document.getElementById('grid')
  for (const icon of document.getElementById('icons').content.children) {
    const card = document.createElement('article')
    card.className = 'card'
    const demo = (theme) => {
      const d = document.createElement('div')
      d.className = 'demo ' + theme
      const line = document.createElement('span')
      line.className = 'line'
      line.append(icon.cloneNode(true), 'Available for freelance projects')
      d.append(line)
      return d
    }
    const head = document.createElement('header')
    head.innerHTML = `<b>${icon.dataset.n}</b><span>${icon.dataset.name}</span>`
    const why = document.createElement('p')
    why.className = 'why'
    why.textContent = icon.dataset.why
    card.append(head, why, demo('light'), demo('dark'))
    grid.append(card)
  }
</script>
</body>
</html>
